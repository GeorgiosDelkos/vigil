# Uses deny.toml at the repo root. Keep it in every repo.
# Runs `cargo deny check` (advisories, licenses, bans, sources) whenever a change touches the
# dependency graph or the policy, and daily so a new advisory surfaces without a PR. House
# addition: rust-ci-conf has no cargo-deny; the trigger pattern is Tokio's and Wasmtime's.
# Blocking: never continue-on-error.
# No push trigger (2026-11-11, as in check.yml): the PR already checked the same dependency
# graph, and the daily run checks main for advisories published since.
permissions:
  contents: read
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/deny.yml"
  schedule:
    - cron: '0 2 * * *'
# See check.yml for information about how the concurrency cancellation and workflow triggering works
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true
name: deny
jobs:
  deny:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    name: cargo deny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false
      - name: cargo install cargo-deny
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # tag=v2.90.1
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny --locked check
