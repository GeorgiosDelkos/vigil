# Derived from jonhoo/rust-ci-conf @ de512da1e85b with house
# additions (nextest from Tokio).
# This is the main CI workflow that runs the test suite on all pull requests and daily on main.
# Keep it in every repo. It runs the following jobs:
# - required: runs the test suite on macOS (the only platform the app ships on) with stable, and
#   daily also with beta. rust-toolchain.toml pins stable, so RUSTUP_TOOLCHAIN selects the
#   matrix toolchain.
# Every house repo commits Cargo.lock, so every job runs with --locked and there is no
# generate-lockfile fallback.
# See check.yml for information about how the concurrency cancellation and workflow triggering
# works, and why there is no push trigger and beta runs only daily.
permissions:
  contents: read
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '7 4 * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true
name: test
jobs:
  required:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-latest
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    name: macos / ${{ matrix.toolchain }}
    strategy:
      matrix:
        # run on stable and beta to ensure that tests won't break on the next version of the rust
        # toolchain; beta only daily and by hand, since a PR cannot break it
        toolchain: ${{ fromJSON(github.event_name == 'pull_request' && '["stable"]' || '["stable", "beta"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          submodules: true
          # The whole history: the prompt tests check their hash list against every past
          # version of the built-in prompts (crates/core/src/prompts.rs).
          fetch-depth: 0
          persist-credentials: false
      - name: Install ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # branch=master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: cargo install cargo-nextest
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # tag=v2.88.0
        with:
          tool: cargo-nextest
      # https://twitter.com/jonhoo/status/1571290371124260865
      - name: cargo nextest run --locked
        run: cargo nextest run --locked --all-features --all-targets
      # nextest does not run doctests (https://github.com/nextest-rs/nextest/issues/16), and
      # --all-targets skips them anyway (https://github.com/rust-lang/cargo/issues/6669)
      - name: cargo test --doc
        run: cargo test --locked --all-features --doc
