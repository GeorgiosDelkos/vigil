# From jonhoo/rust-ci-conf @ de512da1e85b. Keep it in
# every repo.
# Run scheduled (rolling) jobs on a nightly basis, as your crate may break independently of any
# given PR. E.g., updates to rust nightly and updates to this crates dependencies.
# Only on the schedule and by hand, not on PRs or pushes (decided with the owner on 2026-11-11 to
# cut macOS minutes): a new nightly or a dependency release breaks main whether or not a PR
# changed anything, so a run per PR only repeated the daily answer. The beta clippy and beta
# test jobs of check.yml and test.yml likewise run only daily.
permissions:
  contents: read
on:
  schedule:
    - cron:  '7 7 * * *'
  workflow_dispatch:
name: rolling
jobs:
  # https://twitter.com/mycoliza/status/1571295690063753218
  nightly:
    runs-on: macos-latest
    env:
      # Overrides the stable pin in rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: nightly
    name: macos / nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          submodules: true
          # The whole history, for the prompt tests (see test.yml).
          fetch-depth: 0
          persist-credentials: false
      - name: Install nightly
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # branch=master
        with:
          toolchain: nightly
      - name: cargo test --locked
        run: cargo test --locked --all-features --all-targets
  # https://twitter.com/alcuadrado/status/1571291687837732873
  update:
    # Checks that the next `cargo update` (what Dependabot will propose) still builds and passes
    # the tests, within semver-compatible versions.
    runs-on: macos-latest
    env:
      # Overrides the stable pin in rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: beta
    name: macos / beta / updated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          submodules: true
          # The whole history, for the prompt tests (see test.yml).
          fetch-depth: 0
          persist-credentials: false
      - name: Install beta
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # branch=master
        with:
          toolchain: beta
      - name: cargo update
        run: cargo update
      - name: cargo test
        run: cargo test --locked --all-features --all-targets
        env:
          # surface new deprecations in dependencies before they become removals
          RUSTFLAGS: -D deprecated
