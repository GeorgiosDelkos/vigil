# Mutation testing of the code a PR changes: cargo-mutants
# breaks each changed function in small ways (returns a default, flips a comparison) and fails
# when the tests still pass, which means the tests do not check that code (TST-19). From the
# cargo-mutants guide, https://mutants.rs/pr-diff.html (`--in-diff`), with house pinning.
# Delete for a crate whose test suite takes more than a few minutes: every mutant reruns it.
# Advisory: no branch protection or ruleset requires it (checked 2026-11-11), which is why the
# `paths:` filter below may skip the whole workflow. If it is ever made required, replace the
# filter with a skip step, or a docs-only PR waits on a check that never reports.
#
# Kept fast and cheap (decided with the owner on 2026-11-11, when mutants took 618 of 884 macOS
# minutes, about 4 of each shard's 6.4 spent on an uncached build):
# - It runs only when a PR changes Rust under crates/, the only code that can produce a mutant.
#   `--in-diff` ignores every non-Rust file and the menu-bar app (`exclude_globs` in
#   .cargo/mutants.toml), so a PR that touches only docs, Cargo.lock, prompts or the app has no
#   mutants: the other workflows test those. A PR that changes only tests or comments still
#   runs and finds nothing to mutate; telling those apart needs the diff, so it is accepted.
#   Changes to this file and to the mutants config run it too, to check the setup.
# - The dependencies come from a cache that the `warm` job below fills daily on main. A PR's
#   cache is scoped to that PR, so without a main-branch writer every PR's first run would build
#   from scratch on every shard.
# - `--in-place` builds in that cached `target/`. cargo-mutants' default copies the tree, and a
#   copy cannot reuse the build (https://mutants.rs/in-place.html). The runner's checkout is
#   disposable, as in-place needs, and it is a git checkout with the whole history, which the
#   prompt tests read (`copy_vcs` in .cargo/mutants.toml provides that only for copies).
permissions:
  contents: read
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/**/*.rs"
      - ".cargo/mutants.toml"
      - ".github/workflows/mutants.yml"
  schedule:
    # Daily, before the working day, so the day's PRs restore a cache built from today's main.
    - cron: '37 4 * * *'
  # Warms the cache by hand, as the schedule does; it runs no mutants, which need a PR's diff.
  workflow_dispatch:
concurrency:
  # Ends in the draft flag, so a skipped draft run cannot cancel the ready run that follows it.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true
name: mutants
jobs:
  # Builds what cargo-mutants builds, so the shards restore every dependency already compiled.
  # The only job that saves the cache: rust-cache keeps the dependencies and drops the
  # workspace crates, which every shard rebuilds for its own mutants anyway.
  warm:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-latest
    name: warm the mutants build cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false
      - name: Install stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # branch=master
        with:
          toolchain: stable
      - name: cargo install cargo-nextest
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # tag=v2.90.1
        with:
          tool: cargo-nextest@0.9.150
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # tag=v2.9.3
        with:
          shared-key: mutants
      # cargo-mutants' build phase under nextest, with the packages of `test_package` in
      # .cargo/mutants.toml: another package set unifies the dependencies' features
      # differently and would miss the cache.
      - name: cargo nextest run --no-run
        run: cargo nextest run --no-run --locked --package vigil-core --package vigil
  mutants:
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    # macOS, as in test.yml: a test runs the server script on the runner itself and expects no
    # dpkg database there. PR 50's 45 mutants took 7 to 17 minutes per shard on 8 shards.
    #
    # 4 shards: the account allows 5 concurrent macOS jobs, and a PR also starts 4 other macOS
    # jobs (stable clippy, release build, stable tests, app). More shards only queue behind those
    # and repeat the per-shard setup (toolchain, cache restore, workspace build, baseline test).
    # The shard count must match the `/4` below (https://mutants.rs/shards.html).
    runs-on: macos-latest
    name: cargo mutants (PR diff, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          # The whole history, so the diff against the base branch can be taken, and for the
          # prompt tests (crates/core/src/prompts.rs).
          fetch-depth: 0
          persist-credentials: false
      # HEAD is the merge commit GitHub made for this run, and its first parent is the base it
      # merged into, so every shard gets the same diff. The base branch's tip would not do: a
      # shard queued behind the 5-job limit fetches a later tip if main moves meanwhile, and the
      # shards then split different mutant lists.
      - name: Diff against the base branch
        run: git diff HEAD^1 HEAD | tee git.diff
      - name: Install stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # branch=master
        with:
          toolchain: stable
      # Exact versions, so a new release cannot change how mutants are tested (nextest's
      # fail-fast or termination, cargo-mutants' timeouts) without a diff here. Each was the
      # newest release at least 14 days old on 2026-11-11.
      - name: cargo install cargo-mutants, cargo-nextest
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # tag=v2.90.1
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.150
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # tag=v2.9.3
        with:
          shared-key: mutants
          save-if: false
      # nextest runs every test binary's tests in parallel, each in its own process, and stops
      # starting tests at the first failure, where `cargo test` runs the binaries one after
      # another and each to its end; about 60 s of each mutant was the tests. test.yml runs the
      # suite under the same pinned nextest, so the two agree on what passes. nextest skips doctests,
      # which loses nothing here: no crate has a doctest that runs.
      #
      # `--timeout 240`: in place, cargo-mutants does not scale the timeout from the baseline
      # and falls back to 300 s (https://mutants.rs/timeouts.html); a scaled one would also
      # shrink with nextest's faster baseline and could cut off a slow mutant that still fails
      # its tests, which then counts as a timeout and fails the shard. Under `cargo test` the
      # slowest caught mutant of PR 50 took 68 s of tests; 240 s leaves 3.5 times that for a
      # slow runner, and caps a hung mutant at 4 minutes.
      - name: cargo mutants
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          cargo mutants --no-shuffle -vV --in-diff git.diff --in-place --cargo-arg=--locked
          --test-tool=nextest --timeout 240 --shard "$SHARD/4"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          name: mutants.out-${{ matrix.shard }}
          path: mutants.out
