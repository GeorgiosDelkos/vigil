# Run the core's and the CLI's tests against each mutant, not only the mutated package's: the
# CLI's end-to-end tests are what exercise the core's command-running collectors. Not the
# whole workspace: the menu-bar app's release build needs its web UI built first (app.yml
# checks it). Its pure decisions (tray::Look) are covered by its own unit tests, run by
# `cargo test -p vigil-app`; the rest is Tauri glue that needs a running app.
test_package = ["vigil-core", "vigil"]
exclude_globs = ["app/**"]
# The prompt tests read the built-in prompts' git history, so each mutant's copy of the tree
# needs the repository's history (crates/core/src/prompts.rs).
copy_vcs = true
# These two run /usr/bin/security against the user's login Keychain, which no test may touch,
# so a mutant there cannot be caught. Their decisions are in `saved` and `keychain_script`,
# which are mutated and tested.
#
# `replace < with <= in stop` changes `Instant::now() < deadline` in the grace loop of
# `cancel::stop`. The two differ only at the very instant of the deadline, and both then send
# SIGKILL, so no test can tell them apart: an equivalent mutant.
#
# `replace == with != in tree` makes the tree every process whose parent is not the root,
# which is nearly every process of the user, and the cancel tests then signal all of them. On
# CI that stopped the runner itself ("The runner has received a shutdown signal", PR #21), and
# on a Mac it would end the user's session. It cannot be run safely, so it is excluded;
# `the_tree_holds_the_root_s_descendants_and_nothing_else` checks what it would break.
#
# `open_in_browser` in the CLI runs /usr/bin/open on the report, which opens the user's browser;
# no test may do that, so `Ok(())` in its place cannot be caught. `vigil report` without
# `--open` is tested.
#
# `replace - with + in log_tail` changes the read bound `LOG_TAIL + (start - from)`, which is
# larger than what is left of the file unless the log grows between reading its length and
# reading its tail. The agent has exited by then, so no test can grow it in that gap: both
# bounds read the same bytes, an equivalent mutant.
#
# `replace | with ^` in `findings::read` and `agent::log_head` changes `O_NOFOLLOW | O_NONBLOCK`.
# The two flags are distinct bits, so `^` gives the same value: an equivalent mutant. (`&`,
# which gives no flags, is caught by their link and FIFO tests.)
#
# `FixPlan::target` is a plain accessor whose only caller is the menu-bar app (the place in the
# fix's headline), and the app's tests are not run against mutants (see `test_package`).
#
# `replace | with ^ in entered` changes the mask `UF_HIDDEN | SF_DATALESS` in the lockfile
# walk. The two flags are separate bits (0x8000 and 0x4000_0000, <sys/stat.h>), so `|` and `^`
# build the same mask: an equivalent mutant.
exclude_re = [
    "NvdAccess::has_keychain_key",
    "NvdAccess::save_to_keychain",
    "replace < with <= in stop$",
    "replace == with != in tree$",
    "FixPlan::target",
    "replace - with \\+ in log_tail$",
    "open_in_browser",
    "replace \\| with \\^ in entered$",
    "findings\\.rs:.*replace \\| with \\^ in read$",
    "agent\\.rs:.*replace \\| with \\^ in log_head$",
]
