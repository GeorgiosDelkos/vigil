[package]
name = "vigil-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Vigil's menu-bar app"

[features]
# Serves the built UI from inside the app instead of the dev server's URL. `cargo tauri build`
# turns it on; CI turns it on to check the release configuration.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
vigil-core = { path = "../../crates/core" }
# macos-private-api: the transparent window the HUD material shows through.
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2.7.0"
tauri-plugin-autostart = "2.7.0"
# The folder picker in settings.
tauri-plugin-dialog = "2.8.3"
tauri-plugin-positioner = { version = "2.4.0", features = ["tray-icon"] }
# std: Timestamp::now for the schedule.
jiff = { version = "0.2.39", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
# A real log file for the fix view's last-line test; the core uses the same version.
tempfile = "3.27.0"
