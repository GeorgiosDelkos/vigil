[package]
name = "vigil-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Vigil's menu-bar app"

[features]
# Serves the built UI from inside the app instead of the dev server's URL. `cargo tauri build`
# turns it on; CI turns it on to check the release configuration.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
vigil-core = { path = "../../crates/core" }
# macos-private-api: the transparent window the HUD material shows through.
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2.7.0"
tauri-plugin-autostart = "2.7.0"
# The folder picker in settings.
tauri-plugin-dialog = "2.8.3"
tauri-plugin-positioner = { version = "2.4.0", features = ["tray-icon"] }
# std: Timestamp::now for the schedule.
jiff = { version = "0.2.39", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
# Updates from GitHub Releases. native-tls: the TLS stack the core's ureq already uses
# (Security.framework on macOS), not the default rustls and ring; zip is for Windows installers.
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls"] }
# Not called directly: `generate_context!` writes the `plugins` section of tauri.conf.json (the
# updater's config) as serde_json values, so the crate must depend on it.
serde_json = "1.0.154"

[lints]
workspace = true

[dev-dependencies]
# A real log file for the fix view's last-line test; the core uses the same version.
tempfile = "3.27.0"
# examples/verify_update.rs, which the release workflow runs: the signature check the updater
# plugin itself uses, in the same version.
minisign-verify = "0.3.0"
