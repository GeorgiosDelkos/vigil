<!doctype html>
<!--
  Vigil's app icon: the Findings view's vortex on the dark rounded tile, drawn at 1024 px.
  The owner chose it as the logo on 2026-11-09. Render it to ../icon.png as marks.py says:
  headless Chrome, --window-size=1024,1024 --default-background-color=00000000, then
  `sips -z 512 512`. The vortex is the main view's (app/ui/src/orbit.ts): the same seed, arms,
  winding and colours, so the icon and the popover show one picture.
-->
<meta charset="utf-8">
<style>html, body { margin: 0; background: transparent; } canvas { display: block; }</style>
<canvas id="icon" width="1024" height="1024"></canvas>
<script>
"use strict";
const ARMS = 3, WIND = 1.7;
// Cool hues behind the findings, so pink, orange and yellow mean a finding.
const COOL = [[188, 100, 62], [205, 100, 64], [228, 100, 68], [262, 95, 70]];
const FINDINGS = ["#ff2e88", "#ff8a1f", "#ff8a1f", "#ff8a1f", "#ffe14a", "#8fa2ff"];

function seeded(seed) { return () => ((seed = (seed * 16807) % 2147483647) / 2147483647); }

const STREAKS = (() => {
  const rnd = seeded(7), out = [];
  for (let i = 0; i < 150; i++) {
    const u = Math.pow(rnd(), 0.75);
    out.push({ arm: i % ARMS, u, jitter: (rnd() - 0.5) * 0.28, len: 0.22 + rnd() * 0.5 * (0.4 + u),
      width: 0.5 + u * 2.4 + rnd() * 0.8, alpha: 0.25 + rnd() * 0.6, pick: rnd() });
  }
  return out;
})();

function arc(g, cx, cy, base, r, len) {
  g.beginPath();
  for (let k = 0; k <= 12; k++) {
    const th = base + len * (k / 12), rr = r * Math.exp(-(len * k / 12) / WIND);
    const x = cx + Math.cos(th) * rr, y = cy + Math.sin(th) * rr;
    if (k === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.stroke();
}

// The vortex in a w-by-h area, as the main view draws it with findings open.
function vortex(g, w, h) {
  const cx = w / 2, cy = h / 2, R0 = 30, R1 = Math.hypot(w, h) / 2;
  g.globalCompositeOperation = "lighter";
  g.lineCap = "round";
  for (const s of STREAKS) {
    const r = R0 + s.u * (R1 - R0);
    const base = (s.arm / ARMS) * Math.PI * 2 + Math.log(r / R0) * WIND + s.jitter;
    const [hh, ss, ll] = COOL[Math.floor(s.pick * COOL.length)];
    g.strokeStyle = `hsla(${hh}, ${ss}%, ${ll}%, ${s.alpha})`;
    for (const [width, alpha] of [[s.width * 3.2, 0.18], [s.width, 1]]) {
      g.globalAlpha = alpha; g.lineWidth = width; arc(g, cx, cy, base, r, s.len);
    }
  }
  FINDINGS.forEach((colour, i) => {
    const r = R1 * (0.5 + 0.14 * Math.floor(i / ARMS));
    const base = ((i % ARMS) / ARMS) * Math.PI * 2 + Math.log(r / R0) * WIND + 0.12;
    g.strokeStyle = colour;
    for (const [width, alpha] of [[16, 0.16], [7, 0.35], [3, 1]]) {
      g.globalAlpha = alpha; g.lineWidth = width; arc(g, cx, cy, base, r, 0.7);
    }
  });
  g.globalAlpha = 1;
  g.globalCompositeOperation = "source-over";
  // The dark well where the count sits in the popover.
  const well = g.createRadialGradient(cx, cy, 0, cx, cy, 78);
  well.addColorStop(0, "rgba(6,5,13,0.92)");
  well.addColorStop(0.6, "rgba(6,5,13,0.75)");
  well.addColorStop(1, "rgba(6,5,13,0)");
  g.fillStyle = well;
  g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = "destination-in";
  const edge = g.createRadialGradient(cx, cy, R1 * 0.45, cx, cy, R1 * 0.98);
  edge.addColorStop(0, "rgba(0,0,0,1)");
  edge.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = edge;
  g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = "source-over";
}

const canvas = document.getElementById("icon"), g = canvas.getContext("2d");
// macOS's icon grid: an 824 px rounded square centred in 1024.
const tile = new Path2D();
tile.roundRect(100, 100, 824, 824, 185);
const bg = g.createLinearGradient(0, 100, 0, 924);
bg.addColorStop(0, "#16132a");
bg.addColorStop(1, "#06050d");
g.fillStyle = bg;
g.fill(tile);
// The popover's stage is about 372 points square; draw it there and scale it to the tile.
const layer = document.createElement("canvas");
layer.width = 824; layer.height = 824;
const lg = layer.getContext("2d");
lg.scale(824 / 372, 824 / 372);
vortex(lg, 372, 372);
g.save(); g.clip(tile); g.drawImage(layer, 100, 100); g.restore();
g.strokeStyle = "rgba(255,255,255,.12)";
g.lineWidth = 3;
g.stroke(tile);
</script>
