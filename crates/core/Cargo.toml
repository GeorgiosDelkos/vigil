[package]
name = "vigil-core"
description = "Sweeps a Mac, GitHub repos and servers for known vulnerabilities with a coding agent."
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# Every new dependency needs a strong reason: this crate holds all the app's logic, and each
# dependency it adds ships in the tray app, the CLI and every agent-run sweep.
[dependencies]
# std: date and timestamp parsing. serde: `Timestamp` fields in feed records and caches.
jiff = { version = "0.2.39", default-features = false, features = ["serde", "std"] }
# derive: config, feed and cache types. std: `PathBuf` and `String` impls.
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
# raw_value: advisory records kept byte-for-byte as served, for the agent.
serde_json = { version = "1.0.154", default-features = false, features = ["std", "raw_value"] }
# Stores the NVD key in the Keychain without putting it on a command line. Already in the
# tree through native-tls.
thiserror = "2.0.21"
# parse + serde: `toml::from_str` into the `Raw*` config types.
toml = { version = "1.2.0", default-features = false, features = ["parse", "serde"] }
# The settings window's edits to config.toml, keeping the user's comments and layout.
toml_edit = "0.25.18"
# Blocking HTTP: sweeps are sequential, so no async runtime. native-tls-no-default: HTTPS through
# macOS Security.framework and the system trust store (Keychain and corporate CAs included),
# with no bundled CA list (webpki-roots is CDLA-Permissive-2.0, not on the deny.toml list).
# gzip: NVD and OSV responses compress well.
ureq = { version = "3.5.0", default-features = false, features = ["native-tls-no-default", "gzip"] }

[lints]
workspace = true

[dev-dependencies]
flate2 = "1.1.10"
proptest = "1.12.0"
tempfile = "3.27.0"
