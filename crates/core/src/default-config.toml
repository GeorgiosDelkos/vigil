# Vigil configuration. Edit here or in the app's settings window.
#
# The coding agent that runs sweeps and fixes: claude, grok, codex, gemini or opencode.
# agent = "claude"

# The model each agent runs with, as its CLI takes it after --model. Leave an agent out to use
# its own default. opencode names the provider too: opencode = "ollama/gemma4:e4b".
[models]

# Sweep automatically every N hours (every_hours = 24). Leave it unset to sweep only on
# demand.
[schedule]

# How far back the first advisory download goes: "all", or a date like "2025-01-31".
# Later sweeps fetch only what changed since the previous one.
[history]
since = "all"

# Folders searched for lockfiles: Cargo.lock, package-lock.json, npm-shrinkwrap.json, uv.lock
# and poetry.lock.
[mac]
project_dirs = []

# Repositories to sweep, as "owner/name". Uses your `gh` login.
[github]
repos = []

# Servers to sweep over SSH. The app runs a fixed, read-only script on each (OS release and
# packages, kernel, listening sockets, docker containers and images, lockfiles under `dirs`),
# never with sudo. The host key must already be in ~/.ssh/known_hosts and login must not
# prompt. Use an alias from ~/.ssh/config:
#
# [[servers]]
# name = "prod"
# ssh = "prod"
# dirs = ["/srv/app"]
#
# or connection fields (authentication comes from your ssh-agent or key file):
#
# [[servers]]
# name = "db-1"
# host = "10.0.0.5"
# user = "admin"
# port = 22
# identity_file = "~/.ssh/id_ed25519"
