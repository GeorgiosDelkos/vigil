[package]
name = "vigil"
description = "Command-line interface to Vigil."
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
vigil-core = { path = "../core" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# Ctrl-C must cancel the sweep: the agent runs in its own process group, out of the terminal's
# reach, and would keep running after the CLI exits.
ctrlc = "3.5.2"
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
